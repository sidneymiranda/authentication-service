spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:DEV}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:tcp://localhost:9092/~/authservice;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:321}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: ${SPRING_H2_CONSOLE_PATH:/h2-console}
api:
  security:
    token:
      secret: ${API_SECURITY_TOKEN_SECRET:dev-secret-key-with-at-least-32-characters!!}
      issuer: ${API_SECURITY_TOKEN_ISSUER:auth-service}
      expiration-hours: ${API_SECURITY_TOKEN_EXPIRATION_HOURS:1}